name: deployment_workflow
on: [workflow_dispatch,push] 
jobs:
  deployment_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3 
      - name: Set up Node.js
        run: npm ci
      - name: lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build 
      - name: Deploy   
        run: echo "Deploying the application..."
